<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Requisição</title>

</head>

<body>
  <header>
    <h1>Requisição</h1>
  </header>
  <main>
    <div>
      <nav>
        <ul>
          <a href="./index.html">
            <li>Index</li>
          </a>
          <a href="./catalogo.html">
            <li>Catalogo</li>
          </a>
          <a href="#">
            <li>Requisição</li>
          </a>
        </ul>
      </nav>
      <section>
        <aside>
          <h2>Formulario</h2>
          <form action="/submeter" method="post">
            <fieldset>
              <legend>Formulario de Requisição</legend>

              <label for="n_mecanografico">Nª Mecanografico:<label><br />
                  <input type="number" id="n_mecanografico" nome="n_mecanografico" pattern="[0-9]{10}"
                    required /><br /><br />
                  <label for="nome">Nome:</label><br />
                  <input type="text" id="nome" name="nome" minlength="1" maxlength="255" /><br /><br />

                  <label for="email">Email:</label><br />
                  <input type="email" id="email" name="email" required /><br /><br />

                  <label for="perfil">Perfil:</label><br />
                  <select id="perfil">
                    <option value=""></option>
                    <option value="Estudante">Estudante</option>
                    <option value="Docente">Docente</option>
                  </select><br /><br />

                  <label for="tipo_docomento">Tipo de Documento:</label><br />
                  <select id="tipo_documento">
                    <option value=""></option>
                    <option value="Livro">Livro</option>
                    <option value="Tese">Tese</option>
                    <option value="Relatorio">Relatorio</option>
                    <option value="Conjunto de Dados">Conjunto de datos</option>
                    <option value="Recurso Multimedia">Rescurso Multimedia</option>
                  </select><br /><br />

                  <label for="nome_documento">Nome do Documento:</label><br />
                  <input type="text" id="nome_documento" name="nome_documento" /><br /><br />

                  <label for="data_requisicao">Data da Requisiçao</label><br />
                  <input type="date" id="data_requisicao" name="data_requisicao" min="00/00/0000" /><br /><br />

                  <label for="observacoes">Observações:</label><br />
                  <textarea rows="10" cols="50" wrap="hard" id="observacoes" name="observacoes"
                    maxlength="255"></textarea>
                  <br /><br />

                  <input type="checkbox" id="rgpd" name="rgpd" required>
                  <label for="rgpd">Declaro que li e aceito os termos do RGPD.</label><br /><br />

                  <button type="submit">Enviar</button>
            </fieldset>
          </form>
        </aside>
      </section>
    </div>
  </main>
  <footer>
    <p>footer</p>
  </footer>
</body>

</html>
